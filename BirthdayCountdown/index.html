<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🎂 Birthday Countdown 🎉</h1>

    <div class="countdown">
      <div class="box">
        <span id="days">00</span>
        <p>Days</p>
      </div>
      <div class="box">
        <span id="hours">00</span>
        <p>Hours</p>
      </div>
      <div class="box">
        <span id="minutes">00</span>
        <p>Minutes</p>
      </div>
      <div class="box">
        <span id="seconds">00</span>
        <p>Seconds</p>
      </div>
    </div>

    <h2 id="message"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
